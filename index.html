<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOUCHLINE 26</title>
<style>
:root{--bg:#081421;--panel:#152a3d;--line:#385066;--fg:#edf5fa;--sub:#a8bac8;--accent:#43d9a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Malgun Gothic",sans-serif}
button,input,select{font:inherit}
button{background:#247e60;color:white;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}
button:hover{filter:brightness(1.14)}
button:disabled{opacity:.4;cursor:default}
button.alt{background:#385269}
button.danger{background:#a63e50}
input,select{background:#0b1e2e;color:white;border:1px solid #4b6378;border-radius:7px;padding:9px;max-width:100%}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
aside{background:#102334;border-right:1px solid var(--line);padding:15px}
.logo{font-size:23px;font-weight:900;color:var(--accent);margin-bottom:20px}
nav button{display:block;width:100%;margin:3px 0;text-align:left;background:transparent}
nav button.active{background:#28634e}
main{padding:18px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:9px}
.between{justify-content:space-between}
.muted{color:var(--sub)}
.good{color:var(--accent)}
.bad{color:#ff8e98}
.big{font-size:27px;font-weight:800;color:var(--accent)}
.scroll{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
td,th{padding:9px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}
th{color:#b7cfdd}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--accent)}
.pill{background:#304c61;border-radius:18px;padding:4px 9px;font-size:12px}
.notice{background:#342e25;border-left:4px solid #e8b969;padding:12px;border-radius:6px}
.pitch{background:repeating-linear-gradient(0deg,#155d40 0 70px,#1d704c 70px 140px);border:2px solid #83bba0;border-radius:12px;min-height:450px;padding:15px 5px;display:flex;flex-direction:column;justify-content:space-around}
.pitchrow{display:flex;justify-content:space-around;gap:5px}
.position{width:110px;min-height:72px;border:1px solid #a0d3b5;background:#0c4534e8;border-radius:8px;padding:5px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px}
.position small{color:#b7e7d0}
.playercard{background:#1b4250;border:1px solid #84bfa8;border-radius:7px;padding:6px;cursor:grab;user-select:none;touch-action:none}
.playercard.selected{outline:3px solid #e8cf78}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;min-height:65px}
#ghost{position:fixed;pointer-events:none;z-index:9999;background:#174d3c;border:1px solid #90e6ba;padding:9px;border-radius:7px;display:none}
#toast{position:fixed;right:15px;bottom:15px;z-index:1000;background:#287c5c;padding:12px;border-radius:9px;display:none}
pre{white-space:pre-wrap;overflow:auto;background:#0b1b29;padding:12px;border-radius:7px}
@media(max-width:760px){
.layout{display:block}
aside{padding:10px}
nav{display:flex;overflow-x:auto}
nav button{width:auto;white-space:nowrap}
main{padding:10px}
.position{width:19%;min-width:55px;font-size:10px}
.position small{font-size:9px}
.playercard{font-size:10px;padding:4px}
}
</style>
</head>

</div>
</div>
<div id="app"></div>
</main>

function getTeam(id){
return G.teams.find(t=>t.id===id);
}
function getPlayer(id){
return G.players.find(p=>p.id===id);
}
function squad(id){
return G.players.filter(p=>p.team===id);
}
function ownTeam(){
return getTeam(G.club);

function nextId(prefix){
return prefix+(G.sequence++);
}
function positions(){
return FORMATIONS[G.formation].flat();
}

return t.country+" / "+t.league;
}
function resetTeam(t){
t.w=0;t.d=0;t.l=0;
t.gf=0;t.ga=0;t.points=0;
}
function playerValue(ovr,age){
return Math.round(Math.max(
100000,
Math.pow(ovr/75,7)*13000000*
Math.max(.3,(35-age)/13)
));
}
function makeStats(pos,ovr){
let x={
pace:random(35,85),
shooting:random(20,80),
passing:random(35,85),
dribbling:random(35,85),
defending:random(20,80),
physical:random(40,85),
gk:random(5,20)
};
const main=pos==="GK"?"gk":
pos==="ST"?"shooting":
["CB","LB","RB","DM"].includes(pos)?"defending":
"passing";
x[main]=ovr;
return x;
}
function createPlayer(t,data){
const pos=POSITIONS.includes(data.pos)?data.pos:"CM";
const age=Math.max(15,Math.min(50,Number(data.age)||20));
const ovr=Math.max(40,Math.min(99,Number(data.ovr)||65));
return {
id:nextId("p"),
team:t.id,
name:data.name,
originalName:data.originalName||data.name,
pos,age,ovr,
stats:data.stats||makeStats(pos,ovr),
value:Number(data.value)||playerValue(ovr,age),
contract:Number(data.contract)||3,
generated:!!data.generated,
source:data.source||"사용자 등록"
};
}

function initialize(){
G={
year:2026,
sequence:1,
manager:"",
club:null,
teams:[],
players:[],
fixtures:[],
cups:[],
results:[],
history:[],
transfers:[],
inbox:[],
rating:65,
contract:3,
fired:false,
formation:"4-3-3",
lineup:Array(11).fill(null),
tactic:"균형",
tempo:"보통",
press:"중간"
};

for(const [country,league,tier,names] of LEAGUES){
names.split("|").forEach((name,i)=>{
const strength=Math.max(53,85-i*.8-(tier-1)*5);
const t={
id:nextId("t"),
country,league,tier,name,strength,
budget:Math.round((strength-40)*random(1,4)*1000000)
};
resetTeam(t);
G.teams.push(t);
});
}

createSeason();
}

function createRoundRobin(ids,key){
let arr=ids.slice();
if(arr.length%2)arr.push(null);
const n=arr.length;

for(let r=0;r<n-1;r++){
for(let i=0;i<n/2;i++){
const a=arr[i],b=arr[n-1-i];
if(!a||!b)continue;

const h=(r+i)%2===0?a:b;
const v=h===a?b:a;

G.fixtures.push({
league:key,round:r+1,
home:h,away:v,
played:false,score:null
});
G.fixtures.push({
league:key,round:r+n,
home:v,away:h,
played:false,score:null
});
}
arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
}
}

function createSeason(){
G.fixtures=[];
const keys=[...new Set(G.teams.map(leagueKey))];

for(const key of keys){
createRoundRobin(
G.teams.filter(t=>leagueKey(t)===key).map(t=>t.id),
key
);
}

G.cups=[];
for(const [country,name] of Object.entries(CUPS)){
G.cups.push({
name,country,
participants:G.teams
.filter(t=>t.country===country)
.map(t=>t.id),
round:0,
winner:null,
history:[]
});
}

const top=G.teams
.filter(t=>t.tier===1)
.sort((a,b)=>b.strength-a.strength);

[
["UEFA 챔피언스리그",0],
["UEFA 유로파리그",32],
["UEFA 컨퍼런스리그",64]
].forEach(([name,start])=>{
G.cups.push({
name,country:"유럽",
participants:top.slice(start,start+32).map(t=>t.id),
round:0,winner:null,history:[]
});
});
}

function leagueTable(country,league){
return G.teams
.filter(t=>t.country===country&&t.league===league)
.sort((a,b)=>
b.points-a.points||
(b.gf-b.ga)-(a.gf-a.ga)||
b.gf-a.gf
);
}

function nextFixture(){
return G.fixtures
.filter(f=>!f.played&&
(f.home===G.club||f.away===G.club))
.sort((a,b)=>a.round-b.round)[0];
}

function teamStrength(id){
const t=getTeam(id);
const players=squad(id).sort((a,b)=>b.ovr-a.ovr).slice(0,11);
let value=players.length?
players.reduce((s,p)=>s+p.ovr,0)/players.length:
t.strength;

if(id===G.club){
const chosen=G.lineup.map(getPlayer);
if(chosen.filter(Boolean).length===11){
value=chosen.reduce((s,p,i)=>
s+p.ovr-(p.pos===positions()[i]?0:9),0
)/11;
}
if(G.tactic==="공격")value+=1;
if(G.tactic==="역습")value+=.8;
if(G.tactic==="점유율")value+=.7;
if(G.press==="높음")value+=.5;
}
return value;
}

function goalCount(expected){
let goals=0;
for(let i=0;i<7;i++){
if(Math.random()<Math.min(.8,expected/7))goals++;
}
return goals;
}

function simulate(a,b){
const diff=teamStrength(a)-teamStrength(b);
return [
goalCount(Math.max(.2,1.4+diff/18)),
goalCount(Math.max(.2,1.1-diff/18))
];
}

function applyFixture(f){
const [a,b]=simulate(f.home,f.away);
f.played=true;
f.score=[a,b];

const home=getTeam(f.home);
const away=getTeam(f.away);

home.gf+=a;home.ga+=b;
away.gf+=b;away.ga+=a;

if(a>b){
home.w++;home.points+=3;away.l++;
}else if(a<b){
away.w++;away.points+=3;home.l++;
}else{
home.d++;away.d++;
home.points++;away.points++;
}
return [a,b];
}

function playMatch(){
if(G.fired)return notify("감독이 경질된 상태입니다.");

const next=nextFixture();
if(!next)return notify("리그 일정이 종료되었습니다.");

const games=G.fixtures.filter(f=>
!f.played&&
f.round===next.round&&
f.league===next.league
);

for(const f of games){
const [a,b]=applyFixture(f);

if(f===next){
const diff=f.home===G.club?a-b:b-a;

G.rating=Math.max(0,Math.min(100,
G.rating+(diff>0?4:diff===0?0:-6)
));

G.results.unshift(
`${getTeam(f.home).name} ${a} : ${b} ${getTeam(f.away).name}`
);
}
}

if(G.rating<20){
G.fired=true;
G.inbox.unshift("이사회가 감독을 경질했습니다.");
}

saveGame();
render();
}

function playCup(index){
const cup=G.cups[index];
if(!cup||cup.winner)return;

const ids=[...cup.participants];
if(ids.length<2){
cup.winner=ids[0]||null;
saveGame();render();
return;
}

for(let i=ids.length-1;i>0;i--){
const j=random(0,i);
[ids[i],ids[j]]=[ids[j],ids[i]];
}

const next=[];
const results=[];

for(let i=0;i<ids.length;i+=2){
const a=ids[i],b=ids[i+1];

if(!b){
next.push(a);
continue;
}

let [x,y]=simulate(a,b);

if(x===y){
if(Math.random()<.5)x++;
else y++;
}

const winner=x>y?a:b;
next.push(winner);

results.push({
home:getTeam(a).name,
away:getTeam(b).name,
a:x,b:y,
winner:getTeam(winner).name
});
}

cup.round++;
cup.history.push({
round:cup.round,
results
});
cup.participants=next;

if(next.length===1){
cup.winner=next[0];
G.inbox.unshift(
`${cup.name} 우승: ${getTeam(cup.winner).name}`
);
}

saveGame();
render();
}

function autoLineup(){
const used=new Set();

G.lineup=positions().map(pos=>{
const candidates=squad(G.club)
.filter(p=>!used.has(p.id))
.sort((a,b)=>
(b.ovr-(b.pos===pos?0:14))-
(a.ovr-(a.pos===pos?0:14))
);

const p=candidates[0];
if(p)used.add(p.id);
return p?.id||null;
});
}

function placePlayer(id,index){
const p=getPlayer(id);
if(!p||p.team!==G.club)return;

const old=G.lineup.indexOf(id);
if(old===index)return;

const replaced=G.lineup[index];

if(old>=0)G.lineup[old]=replaced||null;
G.lineup[index]=id;

selectedPlayer=null;
saveGame();
render();
}

function benchPlayer(id){
const index=G.lineup.indexOf(id);
if(index>=0)G.lineup[index]=null;
selectedPlayer=null;
saveGame();
render();
}

function selectPlayer(id){
selectedPlayer=selectedPlayer===id?null:id;
render();
}

function pointerStart(e,id){
if(e.button!==undefined&&e.button!==0)return;
drag={
id,
x:e.clientX,
y:e.clientY,
moved:false
};
$("ghost").textContent=getPlayer(id)?.name||"";
}

document.addEventListener("pointermove",e=>{
if(!drag)return;

if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){
drag.moved=true;
$("ghost").style.display="block";
$("ghost").style.left=e.clientX+12+"px";
$("ghost").style.top=e.clientY+12+"px";
}
});

document.addEventListener("pointerup",e=>{
if(!drag)return;

$("ghost").style.display="none";

if(drag.moved){
const target=document.elementFromPoint(e.clientX,e.clientY);
const position=target?.closest("[data-position]");
const bench=target?.closest("[data-bench]");

if(position){
placePlayer(drag.id,Number(position.dataset.position));
}else if(bench){
benchPlayer(drag.id);
}
}

drag=null;
});

function changeFormation(f){
G.formation=f;
autoLineup();
saveGame();
render();
}

function changeSetting(key,value){

}

function buyPlayer(id){
const p=getPlayer(id);
if(!p||p.team===G.club)return;

const input=prompt(
`${p.name} 영입 제안\n시장 가치 ${money(p.value)}\n제안 금액 ($)`,
Math.round(p.value*1.1)
);
if(input===null)return;

let fee=Number(input.replace(/,/g,""));
if(!Number.isFinite(fee)||fee<=0)return;

if(fee>ownTeam().budget){
notify("이적 예산이 부족합니다.");
return;
}

const seller=getTeam(p.team);
const minimum=p.value*(.9+Math.random()*.4);

if(fee<minimum){
const counter=Math.round(minimum);

if(!confirm(
`제안 거절\n역제안: ${money(counter)}\n수락하시겠습니까?`
))return;

fee=counter;
}

if(fee>ownTeam().budget){
notify("역제안을 수락할 예산이 없습니다.");
return;
}

ownTeam().budget-=fee;
seller.budget+=fee;
p.team=G.club;

G.transfers.unshift(
`${p.name} 영입 · ${money(fee)}`
);

saveGame();
render();
}

function sellPlayer(id){
const p=getPlayer(id);
if(!p||p.team!==G.club)return;

const input=prompt(
`${p.name} 판매 희망액 ($)`,
p.value
);
if(input===null)return;

const fee=Number(input.replace(/,/g,""));
if(!Number.isFinite(fee)||fee<=0)return;

const buyers=G.teams.filter(t=>
t.id!==G.club&&t.budget>=fee
);

if(!buyers.length){
notify("구매 가능한 구단이 없습니다.");
return;
}

if(fee>p.value*(.8+Math.random()*.7)){
notify("판매 제안이 거절되었습니다.");
return;
}

const buyer=pick(buyers);

buyer.budget-=fee;
ownTeam().budget+=fee;
p.team=buyer.id;

G.transfers.unshift(
`${p.name} → ${buyer.name} · ${money(fee)}`
);

autoLineup();
saveGame();
render();
}

function endSeason(){
if(nextFixture()){
notify("리그 일정을 먼저 완료하세요.");
return;
}

const t=ownTeam();
const table=leagueTable(t.country,t.league);

G.history.unshift({
year:G.year,
club:t.name,
rank:table.findIndex(x=>x.id===t.id)+1,
points:t.points
});

const moves=[];

for(const country of ["잉글랜드","독일","이탈리아","스페인"]){
const tiers=[...new Set(
G.teams.filter(t=>t.country===country).map(t=>t.tier)
)].sort((a,b)=>a-b);

for(let i=0;i<tiers.length-1;i++){
const upper=G.teams.filter(t=>
t.country===country&&t.tier===tiers[i]
);
const lower=G.teams.filter(t=>
t.country===country&&t.tier===tiers[i+1]
);

const upperLeague=upper[0]?.league;
const lowerLeague=lower[0]?.league;
if(!upperLeague||!lowerLeague)continue;

const upTable=leagueTable(country,upperLeague);
const downTable=leagueTable(country,lowerLeague);
const count=Math.min(3,upTable.length,downTable.length);

for(let j=0;j<count;j++){
moves.push({
relegated:upTable[upTable.length-1-j],
promoted:downTable[j],
upperLeague,lowerLeague,
upperTier:tiers[i],
lowerTier:tiers[i+1]
});
}
}
}

for(const m of moves){
m.relegated.league=m.lowerLeague;
m.relegated.tier=m.lowerTier;
m.promoted.league=m.upperLeague;
m.promoted.tier=m.upperTier;
}

for(const p of G.players){
p.age++;
p.contract=Math.max(0,p.contract-1);

if(p.age<26&&Math.random()<.5){
p.ovr=Math.min(99,p.ovr+random(0,2));
}
if(p.age>32&&Math.random()<.45){
p.ovr=Math.max(40,p.ovr-random(0,2));
}

p.value=playerValue(p.ovr,p.age);
}

G.year++;

for(const team of G.teams){
const count=random(3,4);

for(let i=0;i<count;i++){
const pos=pick(POSITIONS);
const name=pick(YOUTH_SURNAMES)+pick(YOUTH_NAMES);

G.players.push(createPlayer(team,{
name,pos,age:20,
ovr:random(48,75),
generated:true,
source:"게임 생성 유망주"
}));
}

resetTeam(team);
team.budget+=random(5,30)*1000000;
}

G.contract--;
if(G.contract<=0)G.contract=2;
G.rating=Math.min(100,G.rating+8);

createSeason();
autoLineup();

G.inbox.unshift(
`${G.year}년 새 시즌 시작. 기존 선수 나이 1세 증가, 구단별 20세 유망주 3~4명 생성.`
);

saveGame();
render();
}

if(slotData(n)&&!confirm(
`슬롯 ${n}의 데이터를 덮어쓸까요?`
))return;

slot=n;
initialize();

try{
const response=await fetch(
PLAYER_DATA_URL,
{cache:"no-store"}
);

if(!response.ok){
throw new Error("HTTP "+response.status);
}

const data=await response.json();
const list=Array.isArray(data)?data:data?.players;

if(!Array.isArray(list)){
throw new Error("players.json에 선수 배열이 없습니다.");
}

let count=0;
let skipped=0;

for(const x of list){
const club=G.teams.find(t=>
t.name===x.club&&
(!x.league||t.league===x.league)
);

if(!club){
skipped++;
continue;
}

const name=String(
x.name_ko||x.name||""
).trim();

if(!name){
skipped++;
continue;
}

if(squad(club.id).some(p=>
p.name===name
)){
skipped++;
continue;
}

G.players.push(createPlayer(club,{
name,
originalName:x.name||name,
age:x.age,
pos:x.position||x.pos,
ovr:x.ovr,
value:x.value,
contract:x.contract,
stats:x.stats,
generated:false,
source:x.source||"GitHub 실제 선수단"
}));

count++;
}

notify(`선수 ${count}명 불러오기 완료`);
if(skipped){
console.warn("등록되지 않은 선수:",skipped);
}

}catch(error){
alert(
"GitHub 선수 데이터를 불러오지 못했습니다.\n"+
error.message
);
}

slotScreen=false;
page="start";
render();
}

function importJSON(event){

if(!file)return;

const reader=new FileReader();

reader.onload=()=>{
try{
const data=JSON.parse(reader.result);

if(
data&&
!Array.isArray(data)&&
Array.isArray(data.teams)&&
Array.isArray(data.players)
){
if(!slot){
alert("저장 슬롯을 먼저 선택하세요.");
return;
}
G=data;

page=G.club?"home":"start";

return;
}

const list=Array.isArray(data)?data:data.players;
if(!Array.isArray(list))throw Error("선수 배열이 없습니다.");

let added=0;
let skipped=0;
const unmatched=new Set();

for(const x of list){
const clubName=String(x.club||x.team||"").trim();
const leagueName=String(x.league||"").trim();

const candidates=G.teams.filter(t=>
t.name===clubName&&
(!leagueName||t.league===leagueName)
);

if(candidates.length!==1){
unmatched.add(clubName||"(구단명 없음)");
skipped++;
continue;
}

const t=candidates[0];
const name=String(x.name_ko||x.name||"").trim();

if(!name){
skipped++;
continue;
}

if(squad(t.id).some(p=>
p.name===name||
p.originalName===String(x.name||"")
)){
skipped++;
continue;
}

const p=createPlayer(t,{
name,
originalName:x.name||name,
age:x.age,
pos:x.position||x.pos,
ovr:x.ovr,
value:x.value,
contract:x.contract,
stats:x.stats,
generated:false,
source:x.source||"외부 선수단 JSON"
});

G.players.push(p);
added++;
}

if(G.club)autoLineup();

saveGame();
render();

alert(
`선수 데이터 등록 결과\n`+
`추가: ${added}명\n`+
`중복·미등록: ${skipped}명\n`+
`구단명 매칭 실패: ${unmatched.size}개\n\n`+
[...unmatched].slice(0,15).join(", ")
);

}catch(err){
alert("JSON 파일 오류: "+err.message);
}
};

reader.readAsText(file);
event.target.value="";
}

function setSort(field){
if(sortField===field){
sortAscending=!sortAscending;
}else{
sortField=field;
sortAscending=field!=="ovr";
}
render();
}

function sortPlayers(list){
return [...list].sort((a,b)=>{
let result=0;

if(sortField==="name"){
result=a.name.localeCompare(b.name,"ko");
}else if(sortField==="pos"){
result=POSITIONS.indexOf(a.pos)-POSITIONS.indexOf(b.pos);
}else{
result=(a[sortField]||0)-(b[sortField]||0);
}

return sortAscending?result:-result;
});
}

<td>

<button onclick="${p.team===G.club?"sellPlayer":"buyPlayer"}('${p.id}')">
${p.team===G.club?"판매":"영입"}
</button>
`:""}
</td>
</tr>
`).join("")}
</table>
</div>`;
}

function slotsView(){
return `
<div class="card">
<h2>새 게임 / 이어하기</h2>
<p>저장 슬롯은 최대 3개입니다.</p>
<div class="grid">
${[1,2,3].map(n=>{
const data=slotData(n);
const t=data?.teams?.find(x=>x.id===data.club);

return `
<div class="card">
<h3>저장 슬롯 ${n}</h3>
${data?`
<p>${escapeHTML(data.manager)}</p>
<p>${escapeHTML(t?.name||"구단 미정")}</p>
<p>${data.year}/${String(data.year+1).slice(2)}</p>
<button onclick="loadGame(${n})">이어하기</button>
<button class="alt" onclick="newGame(${n})">새 게임</button>
<button class="danger" onclick="deleteGame(${n})">삭제</button>
`:`
<p class="muted">비어 있음</p>
<button onclick="newGame(${n})">새 게임 하기</button>
`}
</div>`;
}).join("")}
</div>
</div>`;
}

function startView(){
const leagues=[...new Set(G.teams.map(leagueKey))];

return `
<div class="card">
<h2>감독 커리어 시작</h2>
<p class="notice">
실제 선수단은 GitHub의 data/players.json에서 불러옵니다.
데이터가 없는 구단에는 가상 선수를 자동으로 넣지 않습니다.
</p>
<div class="row">
<input id="managerName" placeholder="감독 이름">
<select id="startLeague" onchange="updateStartTeams()">
${leagues.map(l=>`<option>${escapeHTML(l)}</option>`).join("")}
</select>
<select id="startClub"></select>
<button onclick="startCareer()">커리어 시작</button>
</div>
</div>`;
}

function homeView(){
const t=ownTeam();
const next=nextFixture();
const ranking=leagueTable(t.country,t.league)
.findIndex(x=>x.id===t.id)+1;

return `
<div class="grid">
<div class="card">
<div class="muted">감독 평점</div>
<div class="big">${G.rating}/100</div>
<p>계약 ${G.contract}시즌</p>
</div>
<div class="card">
<div class="muted">리그 순위</div>
<div class="big">${ranking}위</div>
<p>${t.w}승 ${t.d}무 ${t.l}패 · ${t.points}점</p>
</div>
<div class="card">
<div class="muted">이적 예산</div>
<div class="big">${money(t.budget)}</div>
<p>등록 선수 ${squad(t.id).length}명</p>
</div>
</div>

<div class="card">
<h2>다음 경기</h2>
${G.fired?`
<p class="bad">성적 부진으로 경질되었습니다.</p>
<button onclick="setPage('career')">새 구단 찾기</button>
`:next?`
<h3>
${escapeHTML(getTeam(next.home).name)}
VS
${escapeHTML(getTeam(next.away).name)}
</h3>
<p>${next.round}라운드</p>
<button onclick="playMatch()">▶ 경기 진행</button>
<button class="alt" onclick="setPage('tactics')">전술 변경</button>
`:`
<p>이번 시즌 리그 일정이 종료되었습니다.</p>
<button onclick="endSeason()">다음 시즌 시작</button>
`}
</div>

<div class="card">
<h3>최근 경기</h3>
${G.results.slice(0,8).map(x=>`<p>${escapeHTML(x)}</p>`).join("")||"경기 기록 없음"}
</div>

<div class="card">
<h3>구단 소식</h3>
${G.inbox.slice(0,8).map(x=>`<p>${escapeHTML(x)}</p>`).join("")||"새 소식 없음"}
</div>`;
}

function squadView(){
const list=squad(G.club);

return `
<div class="card">
<div class="row between">
<h2>${escapeHTML(ownTeam().name)} 선수단</h2>
<span class="pill">${list.length}명</span>
</div>
${list.length?playerTable(list):`
<p class="notice">
이 구단의 실제 선수단 데이터가 아직 등록되지 않았습니다.
선수 데이터 메뉴에서 JSON을 불러오세요.
</p>
`}
</div>`;
}

function tacticsView(){
let index=0;

const pitch=FORMATIONS[G.formation].map(row=>`
<div class="pitchrow">
${row.map(pos=>{
const i=index++;
const p=getPlayer(G.lineup[i]);

return `
<div class="position" data-position="${i}"
onclick="if(selectedPlayer)placePlayer(selectedPlayer,${i})">
<small>${pos}</small>
${p?`
<div class="playercard ${selectedPlayer===p.id?"selected":""}"
onpointerdown="pointerStart(event,'${p.id}')"
onclick="event.stopPropagation();selectPlayer('${p.id}')">
${escapeHTML(p.name)}
<br>
<small>${p.ovr} · ${p.pos}</small>
</div>
`:`<span class="muted">빈 자리</span>`}
</div>`;
}).join("")}
</div>
`).join("");

const bench=squad(G.club)
.filter(p=>!G.lineup.includes(p.id))
.sort((a,b)=>b.ovr-a.ovr);

return `
<div class="card">
<h2>선발 11명</h2>
<p class="muted">
선수 카드를 마우스로 끌어 경기장에 놓으세요.
모바일에서는 선수를 선택한 뒤 배치할 위치를 눌러도 됩니다.
</p>

<div class="row">
<select onchange="changeFormation(this.value)">
${Object.keys(FORMATIONS).map(f=>`
<option ${G.formation===f?"selected":""}>${f}</option>
`).join("")}
</select>

${[
["tactic",["균형","공격","수비","역습","점유율"]],
["tempo",["느림","보통","빠름"]],
["press",["낮음","중간","높음"]]
].map(([key,values])=>`
<select onchange="changeSetting('${key}',this.value)">
${values.map(v=>`
<option ${G[key]===v?"selected":""}>${v}</option>
`).join("")}
</select>
`).join("")}

<button onclick="autoLineup();saveGame();render()">자동 선발</button>
</div>

<div class="pitch">${pitch}</div>

<h3>후보 선수 (${bench.length}명)</h3>
<div class="bench" data-bench="true">
${bench.map(p=>`
<div class="playercard ${selectedPlayer===p.id?"selected":""}"
onpointerdown="pointerStart(event,'${p.id}')"
onclick="selectPlayer('${p.id}')">
${escapeHTML(p.name)}
<br>
<small>${p.pos} · OVR ${p.ovr} · ${p.age}세</small>
</div>
`).join("")}
</div>

<div class="row" style="margin-top:12px">
<button class="alt" onclick="if(selectedPlayer)benchPlayer(selectedPlayer)">
선택한 선수 후보로 내리기
</button>
</div>
</div>`;
}

function fixturesView(){
const list=G.fixtures
.filter(f=>f.home===G.club||f.away===G.club)
.sort((a,b)=>a.round-b.round);

return `
<div class="card">
<h2>리그 경기 일정</h2>
<div class="scroll">
<table>
<tr>
<th>라운드</th><th>홈</th><th>원정</th><th>결과</th>
</tr>
${list.map(f=>`
<tr>
<td>${f.round}</td>
<td>${escapeHTML(getTeam(f.home).name)}</td>
<td>${escapeHTML(getTeam(f.away).name)}</td>
<td>${f.played?f.score.join(" : "):"예정"}</td>
</tr>
`).join("")}
</table>
</div>
</div>`;
}

function leagueView(){
const keys=[...new Set(G.teams.map(leagueKey))];
const current=keys.includes(selectedLeague)?
selectedLeague:leagueKey(ownTeam());

const t=G.teams.find(t=>leagueKey(t)===current);

return `
<div class="card">
<div class="row between">
<h2>리그 순위</h2>
<select onchange="selectedLeague=this.value;render()">
${keys.map(key=>`
<option ${key===current?"selected":""}>${escapeHTML(key)}</option>
`).join("")}
</select>
</div>

<div class="scroll">
<table>
<tr>
<th>순위</th><th>구단</th><th>경기</th>
<th>승</th><th>무</th><th>패</th>
<th>득실차</th><th>승점</th>
</tr>
${leagueTable(t.country,t.league).map((club,i)=>`
<tr ${club.id===G.club?'style="background:#235344"':""}>
<td>${i+1}</td>
<td>${escapeHTML(club.name)}</td>
<td>${club.w+club.d+club.l}</td>
<td>${club.w}</td>
<td>${club.d}</td>
<td>${club.l}</td>
<td>${club.gf-club.ga}</td>
<td>${club.points}</td>
</tr>
`).join("")}
</table>
</div>
</div>`;
}

function updateTransferSearch(){
playerQuery=$("transferSearch").value;
selectedClub=$("transferClub").value;
render();
}

function transfersView(){
const list=G.players
.filter(p=>p.team!==G.club)
.filter(p=>!playerQuery||
p.name.toLowerCase().includes(playerQuery.toLowerCase()))
.filter(p=>!selectedClub||p.team===selectedClub)
.slice(0,150);

return `
<div class="card">
<h2>이적시장</h2>
<p>이적 예산: <span class="good">${money(ownTeam().budget)}</span></p>

<div class="row">
<input id="transferSearch"
placeholder="선수 이름 검색"
value="${escapeHTML(playerQuery)}">

<select id="transferClub">
<option value="">전체 구단</option>
${G.teams.filter(t=>t.id!==G.club).map(t=>`
<option value="${t.id}" ${selectedClub===t.id?"selected":""}>
${escapeHTML(t.name)}
</option>
`).join("")}
</select>

<button onclick="updateTransferSearch()">검색</button>
</div>

<p>${list.length}명 표시 (최대 150명)</p>
${playerTable(list)}
</div>

<div class="card">
<h3>이적 기록</h3>
${G.transfers.slice(0,20).map(x=>`
<p>${escapeHTML(x)}</p>
`).join("")||"이적 기록 없음"}
</div>`;
}

function cupsView(){
return `
<div class="card">
<h2>국내 컵 및 UEFA 대항전</h2>
<p class="notice">
현재 컵대회는 단판 토너먼트 방식으로 진행됩니다.
실제 대회의 예선, 조별리그, UEFA 리그 페이즈,
국가별 세부 규정은 아직 반영되지 않았습니다.
</p>

${G.cups.map((cup,i)=>`
<div class="card">
<div class="row between">
<h3>${escapeHTML(cup.name)}</h3>
<span class="pill">
${cup.winner?"대회 종료":cup.participants.length+"팀 잔류"}
</span>
</div>

<p>
${cup.winner?
"우승: "+escapeHTML(getTeam(cup.winner).name):
"진행 라운드: "+cup.round}
</p>

${!cup.winner?`
<button onclick="playCup(${i})">다음 라운드 진행</button>
`:""}

${cup.history.slice(-2).reverse().map(h=>`
<details>
<summary>${h.round}라운드 결과</summary>
${h.results.map(r=>`
<p>
${escapeHTML(r.home)} ${r.a} : ${r.b}
${escapeHTML(r.away)}
· 승리 ${escapeHTML(r.winner)}
</p>
`).join("")}
</details>
`).join("")}
</div>
`).join("")}
</div>`;
}

function careerView(){
return `
<div class="card">
<h2>감독 경력</h2>
<p>감독: ${escapeHTML(G.manager)}</p>
<p>현재 구단: ${escapeHTML(ownTeam().name)}</p>
<p>감독 평점: ${G.rating}/100</p>
<p>계약 잔여: ${G.contract}시즌</p>

<h3>다른 구단으로 이동</h3>
<div class="row">
<select id="careerClub">
${G.teams.filter(t=>t.id!==G.club).map(t=>`
<option value="${t.id}">
${escapeHTML(t.name)} · ${escapeHTML(t.league)}
</option>
`).join("")}
</select>
<button onclick="changeClub()">구단 이동</button>
</div>

<h3>시즌 기록</h3>
${G.history.map(h=>`
<p>
${h.year}년 · ${escapeHTML(h.club)}
· ${h.rank}위 · ${h.points}점
</p>
`).join("")||"시즌 기록 없음"}
</div>`;
}

function dataView(){
const covered=G.teams.filter(t=>
squad(t.id).some(p=>!p.generated)
).length;

return `
<div class="card">
<h2>실제 선수단 데이터</h2>

<div class="grid">
<div class="card">
<div class="muted">전체 구단</div>
<div class="big">${G.teams.length}</div>
</div>
<div class="card">
<div class="muted">실명 선수 등록 구단</div>
<div class="big">${covered}</div>
</div>
<div class="card">
<div class="muted">등록 선수</div>
<div class="big">${G.players.length}</div>
</div>
</div>

<p class="notice">
현재 선수단은 GitHub의 data/players.json에서 불러오며,
등록되지 않은 구단에는 가상 선수를 자동으로 채우지 않습니다.
</p>

<button onclick="openImport()">선수단 JSON 파일 직접 불러오기</button>

<h3>선수 데이터 형식</h3>
<pre>{
  "players": [
    {
      "club": "아스널",
      "name": "Bukayo Saka",
      "name_ko": "부카요 사카",
      "age": 25,
      "position": "RW",
      "ovr": 87
    }
  ]
}</pre>

<h3>구단별 등록 현황</h3>
<div class="scroll">
<table>
<tr><th>리그</th><th>구단</th><th>실명 등록</th><th>생성 선수</th></tr>
${G.teams.map(t=>`
<tr>
<td>${escapeHTML(t.league)}</td>
<td>${escapeHTML(t.name)}</td>
<td>${squad(t.id).filter(p=>!p.generated).length}명</td>
<td>${squad(t.id).filter(p=>p.generated).length}명</td>
</tr>
`).join("")}
</table>
</div>
</div>`;
}

function setPage(p){
page=p;
selectedPlayer=null;
render();
}

function render(){
if(slotScreen){
$("heading").textContent="커리어 선택";
$("identity").textContent="저장 슬롯 3개";
$("nav").innerHTML="";
$("app").innerHTML=slotsView();
return;
}

if(page==="start"||!G.club){
$("heading").textContent="새 커리어";
$("identity").textContent="감독 생성";
$("nav").innerHTML="";
$("app").innerHTML=startView();
updateStartTeams();
return;
}

const menus={
home:"대시보드",
squad:"선수단",
tactics:"전술·선발",
fixtures:"경기 일정",
league:"리그 순위",
transfers:"이적시장",
cups:"컵대회",
career:"감독 경력",
data:"선수 데이터"
};

$("heading").textContent=menus[page]||"대시보드";

$("identity").innerHTML=`
<b>${escapeHTML(G.manager)}</b>
<p>${escapeHTML(ownTeam().name)}</p>
<small>${G.year}/${String(G.year+1).slice(2)}</small>
`;

$("nav").innerHTML=Object.entries(menus).map(([key,label])=>`
<button class="${page===key?"active":""}"
onclick="setPage('${key}')">${label}</button>
`).join("");

const views={
home:homeView,
squad:squadView,
tactics:tacticsView,
fixtures:fixturesView,
league:leagueView,
transfers:transfersView,
cups:cupsView,
career:careerView,
data:dataView
};

$("app").innerHTML=views[page]();
}

initialize();
render();
</script>
</body>
</html>
