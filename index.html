<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOUCHLINE 26</title>
<style>
:root{
  --bg:#081421;
  --panel:#152a3d;
  --line:#385066;
  --fg:#edf5fa;
  --sub:#a8bac8;
  --accent:#43d9a0;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:system-ui,"Malgun Gothic",sans-serif;
}
button,input,select{font:inherit}
button{
  background:#247e60;
  color:white;
  border:0;
  border-radius:8px;
  padding:9px 12px;
  cursor:pointer;
}
button:hover{filter:brightness(1.14)}
button:disabled{opacity:.4;cursor:default}
button.alt{background:#385269}
button.danger{background:#a63e50}
input,select{
  background:#0b1e2e;
  color:white;
  border:1px solid #4b6378;
  border-radius:7px;
  padding:9px;
  max-width:100%;
}
.layout{
  display:grid;
  grid-template-columns:210px minmax(0,1fr);
  min-height:100vh;
}
aside{
  background:#102334;
  border-right:1px solid var(--line);
  padding:15px;
}
.logo{
  font-size:23px;
  font-weight:900;
  color:var(--accent);
  margin-bottom:20px;
}
nav button{
  display:block;
  width:100%;
  margin:3px 0;
  text-align:left;
  background:transparent;
}
nav button.active{background:#28634e}
main{padding:18px;min-width:0}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:15px;
  margin:12px 0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:12px;
}
.row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:9px;
}
.between{justify-content:space-between}
.muted{color:var(--sub)}
.good{color:var(--accent)}
.bad{color:#ff8e98}
.big{
  font-size:27px;
  font-weight:800;
  color:var(--accent);
}
.scroll{overflow:auto}
table{
  width:100%;
  border-collapse:collapse;
  white-space:nowrap;
}
td,th{
  padding:9px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  text-align:left;
}
th{color:#b7cfdd}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--accent)}
.pill{
  background:#304c61;
  border-radius:18px;
  padding:4px 9px;
  font-size:12px;
}
.notice{
  background:#342e25;
  border-left:4px solid #e8b969;
  padding:12px;
  border-radius:6px;
}
.pitch{
  background:repeating-linear-gradient(
    0deg,#155d40 0 70px,#1d704c 70px 140px
  );
  border:2px solid #83bba0;
  border-radius:12px;
  min-height:450px;
  padding:15px 5px;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
}
.pitchrow{
  display:flex;
  justify-content:space-around;
  gap:5px;
}
.position{
  width:110px;
  min-height:72px;
  border:1px solid #a0d3b5;
  background:#0c4534e8;
  border-radius:8px;
  padding:5px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:4px;
}
.position small{color:#b7e7d0}
.playercard{
  background:#1b4250;
  border:1px solid #84bfa8;
  border-radius:7px;
  padding:6px;
  cursor:grab;
  user-select:none;
  touch-action:none;
}
.playercard.selected{outline:3px solid #e8cf78}
.bench{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:7px;
  min-height:65px;
}
#ghost{
  position:fixed;
  pointer-events:none;
  z-index:9999;
  background:#174d3c;
  border:1px solid #90e6ba;
  padding:9px;
  border-radius:7px;
  display:none;
}
#toast{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:1000;
  background:#287c5c;
  padding:12px;
  border-radius:9px;
  display:none;
}
pre{
  white-space:pre-wrap;
  overflow:auto;
  background:#0b1b29;
  padding:12px;
  border-radius:7px;
}
.contract-box{
  background:#10283a;
  border:1px solid #3d6474;
  border-radius:10px;
  padding:14px;
  margin:12px 0;
}
.contract-warning{
  color:#ffbd75;
  font-weight:700;
}
.contract-danger{
  color:#ff8e98;
  font-weight:700;
}
.contract-form{
  display:flex;
  flex-wrap:wrap;
  align-items:end;
  gap:10px;
  margin-top:12px;
}
.contract-form label{
  display:flex;
  flex-direction:column;
  gap:5px;
  color:var(--sub);
  font-size:13px;
}
.contract-form input{width:180px}
.contract-form select{min-width:110px}
.contract-result{
  padding:12px;
  border-radius:8px;
  margin:12px 0;
  background:#203c4b;
  border:1px solid #537184;
}
.contract-result.success{border-color:#43d9a0}
.contract-result.fail{border-color:#e9a15f}
.small{font-size:12px}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}
.actions button{
  font-size:12px;
  padding:6px 8px;
}
@media(max-width:760px){
  .layout{display:block}
  aside{padding:10px}
  nav{display:flex;overflow-x:auto}
  nav button{width:auto;white-space:nowrap}
  main{padding:10px}
  .position{
    width:19%;
    min-width:55px;
    font-size:10px;
  }
  .position small{font-size:9px}
  .playercard{font-size:10px;padding:4px}
  .contract-form input{width:145px}
}
</style>
</head>
<body>

<div class="layout">
<aside>
  <div class="logo">⚽ TOUCHLINE 26</div>
  <div id="identity" class="muted"></div>
  <nav id="nav"></nav>
</aside>

<main>
  <div class="row between">
    <h2 id="heading">커리어</h2>
    <div class="row">
      <button class="alt" onclick="saveGame()">저장</button>
      <button class="alt" onclick="showSlots()">저장 목록</button>
      <button class="alt" onclick="exportGame()">백업</button>
    </div>
  </div>
  <div id="app"></div>
</main>
</div>

<div id="ghost"></div>
<div id="toast"></div>

<input
  id="jsonFile"
  type="file"
  accept=".json"
  hidden
  onchange="importJSON(event)"
>

function playerValue(ovr,age){
  return Math.round(Math.max(
    100000,
    Math.pow(ovr/75,7)*13000000*
    Math.max(.3,(35-age)/13)
  ));
}

function makeStats(pos,ovr){
  const x={
    pace:random(35,85),
    shooting:random(20,80),
    passing:random(35,85),
    dribbling:random(35,85),
    defending:random(20,80),
    physical:random(40,85),
    gk:random(5,20)
  };

  const main=pos==="GK"?"gk":
    pos==="ST"?"shooting":
    ["CB","LB","RB","DM"].includes(pos)?
    "defending":"passing";

  x[main]=ovr;

  return x;
}

function graceRemaining(){

    MANAGER_GRACE_MATCHES-G.appointmentMatches
  );
}

function isManagerProtected(){
  return G.appointmentMatches<=
    MANAGER_GRACE_MATCHES;
}

function resetManagerPerformance(){
  G.appointmentMatches=0;
  G.winStreak=0;
  G.lossStreak=0;
}

function updateManagerRating(goalDifference){
  let change=0;

  if(goalDifference>0){
    G.winStreak++;
    G.lossStreak=0;

    change=Math.min(
      4,
      2+(G.winStreak-1)*.5
    );

  }else if(goalDifference<0){
    G.lossStreak++;
    G.winStreak=0;

    change=-Math.min(
      4,
      2+(G.lossStreak-1)*.5
    );

  }else{
    G.winStreak=0;
    G.lossStreak=0;
  }

  // 상한 100점, 하한 제한 없음
  G.rating=Math.min(
    100,
    Math.round((G.rating+change)*10)/10
  );

  // 리그 경기만 보호기간 계산
  G.appointmentMatches++;

  return change;
}

function managerStatusText(){
  if(G.fired)return "감독직 종료";

  if(isManagerProtected()){
    return "부임 보호기간";

  return "정상 평가기간";
}

   연봉 및 선수 생성
========================================= */

function calculateWage(ovr,age,value){
  const marketValue=
    Number(value)||playerValue(ovr,age);

  let wage=marketValue*.055;

  if(ovr>=85)wage*=1.3;
  else if(ovr>=80)wage*=1.15;

  if(age<=21)wage*=.75;
  if(age>=34)wage*=.8;

  return Math.max(
    30000,
    Math.round(wage/1000)*1000
  );
}

function wageOf(p){
  return Number(p.wage)>0?
    Number(p.wage):
    calculateWage(p.ovr,p.age,p.value);
}

function teamPayroll(teamId){
  return squad(teamId).reduce(
    (sum,p)=>sum+wageOf(p),0
  );
}

function contractLabel(p){
  if(p.team===null)return "자유계약";
  if(p.contract<=0)return "만료";
  return p.contract+"년";
}

function createPlayer(t,data){
  const pos=POSITIONS.includes(data.pos)?
    data.pos:"CM";

  const age=Math.max(
    15,Math.min(50,Number(data.age)||20)
  );

  const ovr=Math.max(
    40,Math.min(99,Number(data.ovr)||65)
  );

  const value=Number(data.value)>0?
    Number(data.value):
    playerValue(ovr,age);

  const contract=
    data.contract!==undefined&&
    data.contract!==null&&
    Number.isFinite(Number(data.contract))?
    Math.max(0,Math.floor(Number(data.contract))):
    3;

  const wage=Number(data.wage)>0?
    Number(data.wage):
    calculateWage(ovr,age,value);

  return {
    id:nextId("p"),
    team:t.id,
    name:data.name,
    originalName:data.originalName||data.name,
    pos,
    age,
    ovr,
    stats:data.stats||makeStats(pos,ovr),
    value,
    contract,
    wage,
    generated:!!data.generated,
    source:data.source||"사용자 등록",
    negotiationAttempts:0,
    negotiationYear:G.year
  };
}

function normalizeSave(){
  if(!G)return;

  G.inbox=Array.isArray(G.inbox)?G.inbox:[];
  G.history=Array.isArray(G.history)?G.history:[];
  G.transfers=Array.isArray(G.transfers)?G.transfers:[];
  G.results=Array.isArray(G.results)?G.results:[];
  G.players=Array.isArray(G.players)?G.players:[];
  G.teams=Array.isArray(G.teams)?G.teams:[];
  G.fixtures=Array.isArray(G.fixtures)?G.fixtures:[];
  G.cups=Array.isArray(G.cups)?G.cups:[];

  G.rating=Number.isFinite(Number(G.rating))?
    Number(G.rating):65;

  G.rating=Math.round(G.rating*10)/10;

  G.contract=Number.isFinite(Number(G.contract))?
    Math.max(0,Number(G.contract)):3;

  G.fired=!!G.fired;
  G.firingReason=G.firingReason||"";

  G.managerContractHistory=
    Array.isArray(G.managerContractHistory)?
    G.managerContractHistory:[];

  G.contractHistory=
    Array.isArray(G.contractHistory)?
    G.contractHistory:[];

  G.aiTransferHistory=
    Array.isArray(G.aiTransferHistory)?
    G.aiTransferHistory:[];

  if(!Number.isFinite(Number(G.appointmentMatches))){
    G.appointmentMatches=G.fixtures.filter(f=>
      f.played&&
      (f.home===G.club||f.away===G.club)
    ).length;
  }

  G.appointmentMatches=Math.max(
    0,Math.floor(G.appointmentMatches)
  );

  G.winStreak=Number.isFinite(Number(G.winStreak))?
    Math.max(0,Math.floor(G.winStreak)):0;

  G.lossStreak=Number.isFinite(Number(G.lossStreak))?
    Math.max(0,Math.floor(G.lossStreak)):0;

  for(const p of G.players){
    p.contract=Number.isFinite(Number(p.contract))?
      Math.max(0,Number(p.contract)):3;

    if(!Number.isFinite(Number(p.wage))||
       Number(p.wage)<=0){
      p.wage=calculateWage(
        p.ovr,p.age,p.value
      );
    }

    if(p.team===undefined)p.team=null;

    p.negotiationAttempts=
      Number.isFinite(Number(p.negotiationAttempts))?
      Number(p.negotiationAttempts):0;

    p.negotiationYear=
      Number.isFinite(Number(p.negotiationYear))?
      Number(p.negotiationYear):G.year;
  }

  if(!FORMATIONS[G.formation]){
    G.formation="4-3-3";
  }

  if(!Array.isArray(G.lineup)){
    G.lineup=Array(11).fill(null);
  }

  if(!Number.isFinite(Number(G.sequence))){
    G.sequence=1;
  }

  const maxId=Math.max(
    0,
    ...G.teams.map(t=>
      Number(String(t.id).replace(/\D/g,""))||0
    ),
    ...G.players.map(p=>
      Number(String(p.id).replace(/\D/g,""))||0
    )
  );

  G.sequence=Math.max(G.sequence,maxId+1);

  // 기존 세이브도 보호기간 규칙 적용
  if(!G.fired&&G.club){
    checkManagerRating();
  }
}

function playerWageDemand(p,years){
  const current=wageOf(p);

  const market=calculateWage(
    p.ovr,p.age,p.value
  );

  let demand=Math.max(
    current*.95,
    market
  );

  if(p.age<=24)demand*=1.08;
  if(p.ovr>=85)demand*=1.12;

  if(years===1)demand*=1.08;

  if(years>=4&&p.age<=30){
    demand*=.96;
  }

  if(years>=4&&p.age>=33){
    demand*=1.12;
  }

  return Math.round(demand/1000)*1000;
}

function canNegotiatePlayer(p){
  return !!p&&
    p.team===G.club&&
    !G.fired;
}

function openPlayerContract(id){
  const p=getPlayer(id);

  if(!canNegotiatePlayer(p)){
    notify("이 선수와 재계약할 수 없습니다.");
    return;
  }

  contractPlayerId=id;
  negotiationResult=null;
  page="contracts";
  render();
}

function negotiatePlayer(){
  const p=getPlayer(contractPlayerId);

  if(!canNegotiatePlayer(p)){
    notify("재계약할 수 없습니다.");
    return;
  }

  const years=Number(
    $("playerContractYears").value
  );

  const offered=Number(
    $("playerContractWage").value
  );

  if(!Number.isInteger(years)||
     years<1||years>5){
    notify("추가 계약 기간은 1~5년이어야 합니다.");
    return;
  }

  if(!Number.isFinite(offered)||
     offered<10000){
    notify("연봉을 올바르게 입력하세요.");
    return;
  }

  if(p.negotiationYear!==G.year){
    p.negotiationYear=G.year;
    p.negotiationAttempts=0;
  }

  if(p.negotiationAttempts>=3){
    negotiationResult={
      success:false,
      message:"이번 시즌 협상 횟수 3회를 모두 사용했습니다."
    };
    render();
    return;
  }

  const current=wageOf(p);
  const demand=playerWageDemand(p,years);

  const increase=Math.max(
    0,offered-current
  );

  if(increase>ownTeam().budget){
    negotiationResult={
      success:false,
      message:"추가 연봉을 감당할 예산이 부족합니다."
    };
    render();
    return;
  }

  p.negotiationAttempts++;

  const ratio=offered/demand;

  let accepted=false;

  if(ratio>=1.15){
    accepted=true;
  }else if(ratio>=1){
    accepted=Math.random()<.9;
  }else if(ratio>=.9){
    accepted=Math.random()<.5;
  }else if(ratio>=.8){
    accepted=Math.random()<.15;
  }

  if(accepted){
    const oldYears=p.contract;
    const oldWage=current;

    // 기존 계약 기간에 추가
    const totalYears=oldYears+years;

    ownTeam().budget-=increase;

    p.contract=totalYears;
    p.wage=Math.round(offered);
    p.negotiationAttempts=0;

    G.contractHistory.unshift({
      year:G.year,
      player:p.name,
      team:ownTeam().name,
      oldYears,
      addedYears:years,
      newYears:totalYears,
      oldWage,
      newWage:p.wage
    });

    G.inbox.unshift(
      `${p.name} 재계약 성공 · `+
      `${oldYears}+${years}=${totalYears}년 · `+
      `연봉 ${money(p.wage)}`
    );

    negotiationResult={
      success:true,
      message:
        `${p.name} 선수가 재계약을 수락했습니다. `+
        `기존 ${oldYears}년에 ${years}년이 추가되어 `+
        `총 ${totalYears}년 계약입니다. `+
        `연봉은 ${money(p.wage)}입니다.`
    };

  }else{
    const counter=Math.round(
      demand*(1+Math.random()*.08)/1000
    )*1000;

    G.inbox.unshift(
      `${p.name} 재계약 거절 · `+
      `요구 연봉 ${money(counter)}`
    );

    negotiationResult={
      success:false,
      counter,
      message:
        `${p.name} 선수가 제안을 거절했습니다. `+
        `요구 연봉은 약 ${money(counter)}입니다.`
    };
  }

  saveGame();
  render();
}

  }

/* =========================================
   감독 경질 및 계약
========================================= */

function fireManager(reason){
  if(G.fired)return;

  const team=ownTeam();

  G.fired=true;
  G.firingReason=reason;
  G.contract=0;

  G.inbox.unshift(
    `${team.name} 이사회: ${reason}`
  );

  G.managerContractHistory.unshift({
    year:G.year,
    club:team.name,
    result:"경질 또는 계약 종료",
    reason,
    rating:G.rating,
    appointmentMatches:G.appointmentMatches
  });

  saveGame();
}

function checkManagerRating(){
  if(G.fired)return false;

  // 첫 12경기까지 보호기간
  if(isManagerProtected()){
    if(G.rating<0){
      fireManager(
        `부임 후 ${G.appointmentMatches}경기째 `+
        `감독 평점이 ${ratingText()}점으로 `+
        `0점 미만이 되어 경질되었습니다.`
      );
      return true;
    }

    return false;
  }

  // 13경기째부터 40점 미만 경질
  if(G.rating<MANAGER_FIRING_RATING){
    fireManager(
      `부임 후 ${G.appointmentMatches}경기를 치렀으며 `+
      `감독 평점이 ${ratingText()}점으로 하락해 `+
      `40점 미만 강제 경질 규정이 적용되었습니다.`
    );

    return true;
  }

  return false;
}

function managerRenewalChance(years){
  let chance=0;

  if(G.rating>=90)chance=.98;
  else if(G.rating>=80)chance=.92;
  else if(G.rating>=70)chance=.82;
  else if(G.rating>=60)chance=.68;
  else if(G.rating>=50)chance=.45;
  else if(G.rating>=40)chance=.22;
  else chance=.08;

  if(years>=4)chance-=.1;
  if(years===5)chance-=.08;

  const t=ownTeam();

  const table=leagueTable(
    t.country,t.league
  );

  const rank=table.findIndex(
    x=>x.id===t.id
  )+1;

  if(rank<=3&&t.w+t.d+t.l>=5){
    chance+=.06;
  }

  if(rank>table.length*.75&&
     t.w+t.d+t.l>=5){
    chance-=.08;
  }

  return Math.max(
    .05,Math.min(.99,chance)
  );
}

function renewManager(){
  if(G.fired){
    notify("경질된 상태에서는 재계약할 수 없습니다.");
    return;
  }

  const years=Number(
    $("managerRenewYears").value
  );

  if(!Number.isInteger(years)||
     years<1||years>5){
    notify("추가 계약 기간은 1~5년이어야 합니다.");
    return;
  }

  const chance=managerRenewalChance(years);
  const accepted=Math.random()<chance;

  if(accepted){
    const previous=G.contract;

    // 기존 감독 계약에 기간 추가
    G.contract+=years;

    G.managerContractHistory.unshift({
      year:G.year,
      club:ownTeam().name,
      result:"재계약 성공",
      previous,
      addedYears:years,
      years:G.contract,
      rating:G.rating
    });

    G.inbox.unshift(
      `${ownTeam().name} 이사회가 감독 `+
      `${G.manager}의 계약을 `+
      `${previous}년에서 ${G.contract}년으로 연장했습니다.`
    );

    managerNegotiationResult={
      success:true,
      message:
        `재계약 승인! 기존 ${previous}년에 `+
        `${years}년이 추가되어 `+
        `총 ${G.contract}시즌 계약입니다.`
    };

  }else{
    G.managerContractHistory.unshift({
      year:G.year,
      club:ownTeam().name,
      result:"재계약 거절",
      years,
      rating:G.rating
    });

    G.inbox.unshift(
      `${ownTeam().name} 이사회가 `+
      `${years}년 계약 연장 신청을 거절했습니다.`
    );

    managerNegotiationResult={
      success:false,
      message:
        "이사회가 계약 연장을 거절했습니다. "+
        "기존 계약 기간은 유지됩니다."
    };
  }

  saveGame();
  render();
}

/* =========================================
   AI 구단 선수 평가
========================================= */

function aiSquadRank(p){
  const players=squad(p.team)
    .sort((a,b)=>b.ovr-a.ovr);

  return players.findIndex(
    x=>x.id===p.id
  )+1;
}

function aiRenewalChance(p){
  const t=getTeam(p.team);
  if(!t)return 0;

  const rank=aiSquadRank(p);

  let chance=.25;

  // 능력치와 팀 전력 비교
  const difference=p.ovr-t.strength;

  if(difference>=8)chance+=.35;
  else if(difference>=3)chance+=.25;
  else if(difference>=-3)chance+=.12;
  else if(difference<=-12)chance-=.15;

  // 팀 내 기여도
  if(rank<=11)chance+=.2;
  else if(rank<=18)chance+=.1;
  else if(rank>25)chance-=.12;

  // 나이
  if(p.age<=23)chance+=.15;
  else if(p.age<=28)chance+=.08;
  else if(p.age>=34)chance-=.25;
  else if(p.age>=31)chance-=.12;

  // 유망주 가치
  if(p.age<=21&&p.ovr>=65){
    chance+=.12;
  }

  // 선수단이 부족하면 유지 우선
  if(squad(t.id).length<18){
    chance+=.2;
  }

  return Math.max(
    .03,Math.min(.97,chance)
  );
}

/* =========================================
   AI 자동 재계약
========================================= */

function processAIRenewals(){
  let renewed=0;
  let rejected=0;

  const candidates=G.players.filter(p=>
    p.team!==null&&
    p.team!==G.club&&
    p.contract<=1
  );

  // 팀별 주요 선수 순으로 협상
  candidates.sort((a,b)=>b.ovr-a.ovr);

  for(const p of candidates){
    const t=getTeam(p.team);
    if(!t)continue;

    const chance=aiRenewalChance(p);

    if(Math.random()>=chance){
      rejected++;
      continue;
    }

    let years;

    if(p.age<=23){
      years=random(3,5);
    }else if(p.age<=29){
      years=random(2,4);
    }else if(p.age<=33){
      years=random(1,3);
    }else{
      years=random(1,2);
    }

    const newWage=Math.round(
      playerWageDemand(p,years)*
      (1+Math.random()*.12)
    );

    const increase=Math.max(
      0,newWage-wageOf(p)
    );

    if(increase>t.budget){
      rejected++;
      continue;
    }

    const oldYears=p.contract;

    t.budget-=increase;

    // AI도 기존 계약에 기간 추가
    p.contract+=years;
    p.wage=newWage;

    G.contractHistory.unshift({
      year:G.year,
      player:p.name,
      team:t.name,
      oldYears,
      addedYears:years,
      newYears:p.contract,
      newWage,
      ai:true
    });

    renewed++;
  }

  G.inbox.unshift(
    `AI 구단 계약 협상: `+
    `${renewed}명 재계약, `+
    `${rejected}명 재계약 미체결`
  );

  return {renewed,rejected};
}

/* =========================================
   AI 이적시장
========================================= */

function aiPlayerSaleChance(p,t){
  const rank=aiSquadRank(p);

  let chance=.04;

  if(rank>18)chance+=.12;
  if(rank>25)chance+=.12;

  if(p.age>=32)chance+=.12;
  if(p.age>=35)chance+=.15;

  if(p.ovr<t.strength-8){
    chance+=.12;
  }

  if(p.age<=23&&p.ovr>=t.strength){
    chance-=.08;
  }

  if(p.contract<=1){
    chance+=.08;
  }

  return Math.max(
    .01,Math.min(.6,chance)
  );
}

function aiTransferFee(p){
  const multiplier=
    .85+Math.random()*.5;

  return Math.round(
    p.value*multiplier
  );
}

function aiBuyerScore(p,t){
  let score=0;

  const difference=p.ovr-t.strength;

  if(difference>=5)score+=35;
  else if(difference>=0)score+=25;
  else if(difference>=-5)score+=15;
  else score+=5;

  if(p.age<=23)score+=15;
  else if(p.age<=29)score+=10;
  else if(p.age>=34)score-=10;

  const samePosition=squad(t.id)
    .filter(x=>x.pos===p.pos);

  if(samePosition.length===0)score+=30;
  else if(samePosition.length===1)score+=20;
  else if(samePosition.length===2)score+=10;

  if(squad(t.id).length<20){
    score+=15;
  }

  return score;
}

function aiBuyPlayer(p,buyer,fee){
  const seller=p.team===null?
    null:getTeam(p.team);

  const wage=wageOf(p);

  if(buyer.budget<fee+wage){
    return false;
  }

  buyer.budget-=fee+wage;

  if(seller){
    seller.budget+=fee;
  }

  const oldTeam=seller?
    seller.name:"자유계약";

  p.team=buyer.id;
  p.contract=random(2,4);
  p.negotiationAttempts=0;
  p.negotiationYear=G.year;

  const record=
    `${p.name}: ${oldTeam} → `+
    `${buyer.name} · ${money(fee)}`;

  G.transfers.unshift(record);

  G.aiTransferHistory.unshift({
    year:G.year,
    player:p.name,
    from:oldTeam,
    to:buyer.name,
    fee
  });

  return true;
}

function processAITransfers(){
  let sales=0;
  let freeSignings=0;

  // AI 구단끼리 선수 판매 및 영입
  const candidates=G.players
    .filter(p=>
      p.team!==null&&
      p.team!==G.club
    )
    .sort(()=>Math.random()-.5);

  for(const p of candidates){
    const seller=getTeam(p.team);
    if(!seller)continue;

    // 최소 선수단 규모 유지
    if(squad(seller.id).length<=16){
      continue;
    }

    const chance=aiPlayerSaleChance(
      p,seller
    );

    if(Math.random()>=chance){
      continue;
    }

    const fee=aiTransferFee(p);

    const buyers=G.teams
      .filter(t=>
        t.id!==seller.id&&
        t.id!==G.club&&
        t.budget>=fee+wageOf(p)&&
        squad(t.id).length<35
      )
      .map(t=>({
        team:t,
        score:aiBuyerScore(p,t)
      }))
      .filter(x=>x.score>=20)
      .sort((a,b)=>b.score-a.score);

    if(!buyers.length)continue;

    // 상위 후보 중 무작위 선택
    const chosen=pick(
      buyers.slice(0,Math.min(5,buyers.length))
    );

    if(aiBuyPlayer(
      p,chosen.team,fee
    )){
      sales++;
    }
  }

  // 자유계약 선수 영입
  const freeAgents=G.players
    .filter(p=>p.team===null)
    .sort((a,b)=>b.ovr-a.ovr);

  for(const p of freeAgents){
    const buyers=G.teams
      .filter(t=>
        t.id!==G.club&&
        squad(t.id).length<30&&
        t.budget>=wageOf(p)
      )
      .map(t=>({
        team:t,
        score:aiBuyerScore(p,t)
      }))
      .filter(x=>x.score>=25)
      .sort((a,b)=>b.score-a.score);

    if(!buyers.length)continue;

    const chance=
      p.age<=30?.45:.25;

    if(Math.random()>=chance){
      continue;
    }

    const chosen=pick(
      buyers.slice(0,Math.min(5,buyers.length))
    );

    if(aiBuyPlayer(
      p,chosen.team,0
    )){
      freeSignings++;
    }
  }

  G.inbox.unshift(
    `AI 이적시장: `+
    `구단 간 이적 ${sales}건, `+
    `자유계약 영입 ${freeSignings}건`
  );

  return {sales,freeSignings};
}

      };

    });

  createSeason();
}

/* =========================================
   리그 일정
========================================= */

function createRoundRobin(ids,key){
  let arr=ids.slice();

  if(arr.length%2)arr.push(null);

  const n=arr.length;

  for(let r=0;r<n-1;r++){
    for(let i=0;i<n/2;i++){
      const a=arr[i];
      const b=arr[n-1-i];

      if(!a||!b)continue;

      const h=(r+i)%2===0?a:b;
      const v=h===a?b:a;

      G.fixtures.push({
        league:key,
        round:r+1,
        home:h,
        away:v,
        played:false,
        score:null
      });

      G.fixtures.push({
        league:key,
        round:r+n,
        home:v,
        away:h,
        played:false,
        score:null
      });
    }

    arr=[
      arr[0],
      arr[n-1],
      ...arr.slice(1,n-1)
    ];
  }
}

function createSeason(){
  G.fixtures=[];

  const keys=[
    ...new Set(G.teams.map(leagueKey))
  ];

  for(const key of keys){
    createRoundRobin(
      G.teams
        .filter(t=>leagueKey(t)===key)
        .map(t=>t.id),
      key
    );
  }

  G.cups=[];

  for(const [
    country,name
  ] of Object.entries(CUPS)){
    G.cups.push({
      name,
      country,
      participants:G.teams
        .filter(t=>t.country===country)
        .map(t=>t.id),
      round:0,
      winner:null,
      history:[]
    });
  }

  const top=G.teams
    .filter(t=>t.tier===1)
    .sort((a,b)=>b.strength-a.strength);

  [
    ["UEFA 챔피언스리그",0],
    ["UEFA 유로파리그",32],
    ["UEFA 컨퍼런스리그",64]
  ].forEach(([name,start])=>{
    G.cups.push({
      name,
      country:"유럽",
      participants:top
        .slice(start,start+32)
        .map(t=>t.id),
      round:0,
      winner:null,
      history:[]
    });
  });
}

function leagueTable(country,league){
  return G.teams
    .filter(t=>
      t.country===country&&
      t.league===league
    )
    .sort((a,b)=>
      b.points-a.points||
      (b.gf-b.ga)-(a.gf-a.ga)||
      b.gf-a.gf
    );
}

function nextFixture(){
  return G.fixtures
    .filter(f=>
      !f.played&&
      (f.home===G.club||f.away===G.club)
    )
    .sort((a,b)=>a.round-b.round)[0];
}

/* =========================================
   경기 시뮬레이션
========================================= */

function teamStrength(id){
  const t=getTeam(id);

  const players=squad(id)
    .sort((a,b)=>b.ovr-a.ovr)
    .slice(0,11);

  let value=players.length?
    players.reduce((s,p)=>s+p.ovr,0)/
      players.length:
    t.strength;

  if(id===G.club){
    const chosen=G.lineup.map(getPlayer);

    if(chosen.filter(Boolean).length===11){
      value=chosen.reduce((s,p,i)=>
        s+p.ovr-
        (p.pos===positions()[i]?0:9),
        0
      )/11;
    }

    if(G.tactic==="공격")value+=1;
    if(G.tactic==="역습")value+=.8;
    if(G.tactic==="점유율")value+=.7;
    if(G.press==="높음")value+=.5;
  }

  return value;
}

function goalCount(expected){
  let goals=0;

  for(let i=0;i<7;i++){
    if(Math.random()<
       Math.min(.8,expected/7)){
      goals++;
    }
  }

  return goals;
}

function simulate(a,b){
  const diff=
    teamStrength(a)-teamStrength(b);

  return [
    goalCount(
      Math.max(.2,1.4+diff/18)
    ),
    goalCount(
      Math.max(.2,1.1-diff/18)
    )
  ];
}

function applyFixture(f){
  const [a,b]=simulate(
    f.home,f.away
  );

  f.played=true;
  f.score=[a,b];

  const home=getTeam(f.home);
  const away=getTeam(f.away);

  home.gf+=a;
  home.ga+=b;

  away.gf+=b;
  away.ga+=a;

  if(a>b){
    home.w++;
    home.points+=3;
    away.l++;
  }else if(a<b){
    away.w++;
    away.points+=3;
    home.l++;
  }else{
    home.d++;
    away.d++;
    home.points++;
    away.points++;
  }

  return [a,b];
}

function playMatch(){
  if(G.fired){
    notify("경질된 감독은 경기를 진행할 수 없습니다.");
    return;
  }

  const next=nextFixture();

  if(!next){
    notify("리그 일정이 종료되었습니다.");
    return;
  }

  const games=G.fixtures.filter(f=>
    !f.played&&
    f.round===next.round&&
    f.league===next.league
  );

  let ratingChange=0;

  for(const f of games){
    const [a,b]=applyFixture(f);

    if(f===next){
      const diff=
        f.home===G.club?a-b:b-a;

      ratingChange=updateManagerRating(diff);

      G.results.unshift(
        `${getTeam(f.home).name} `+
        `${a} : ${b} `+
        `${getTeam(f.away).name}`
      );
    }
  }

  const fired=checkManagerRating();

  if(!fired){
    const changeText=ratingChange>0?
      `+${ratingChange.toFixed(1)}`:
      ratingChange.toFixed(1);

    G.inbox.unshift(
      `리그 ${next.round}라운드 종료 · `+
      `감독 평점 ${ratingText()}점 `+
      `(${changeText}) · `+
      `부임 후 ${G.appointmentMatches}경기`
    );
  }

  saveGame();
  render();

  if(fired){
    alert(
      "감독 강제 경질\n\n"+
      `현재 평점: ${ratingText()}점\n`+
      `부임 후 리그 경기: ${G.appointmentMatches}경기\n\n`+
      G.firingReason+"\n\n"+
      "감독 경력 메뉴에서 다른 구단을 선택하세요."
    );
  }
}

/* =========================================
   컵대회
========================================= */

function playCup(index){
  if(G.fired){
    notify("경질된 상태에서는 대회를 진행할 수 없습니다.");
    return;
  }

  const cup=G.cups[index];

  if(!cup||cup.winner)return;

  const ids=[...cup.participants];

  if(ids.length<2){
    cup.winner=ids[0]||null;
    saveGame();
    render();
    return;
  }

  for(let i=ids.length-1;i>0;i--){
    const j=random(0,i);
    [ids[i],ids[j]]=[ids[j],ids[i]];
  }

  const next=[];
  const results=[];

  for(let i=0;i<ids.length;i+=2){
    const a=ids[i];
    const b=ids[i+1];

    if(!b){
      next.push(a);
      continue;
    }

    let [x,y]=simulate(a,b);

    if(x===y){
      if(Math.random()<.5)x++;
      else y++;
    }

    const winner=x>y?a:b;

    next.push(winner);

    results.push({
      home:getTeam(a).name,
      away:getTeam(b).name,
      a,
      b,
      scoreA:x,
      scoreB:y,
      winner:getTeam(winner).name
    });
  }

  cup.round++;

  cup.history.push({
    round:cup.round,
    results
  });

  cup.participants=next;

  if(next.length===1){
    cup.winner=next[0];

    G.inbox.unshift(
      `${cup.name} 우승: `+
      getTeam(cup.winner).name
    );
  }

  saveGame();
  render();
}

/* =========================================
   전술 및 선발
========================================= */

function autoLineup(){
  if(!G.club)return;

  const used=new Set();

  G.lineup=positions().map(pos=>{
    const candidates=squad(G.club)
      .filter(p=>!used.has(p.id))
      .sort((a,b)=>
        (b.ovr-(b.pos===pos?0:14))-
        (a.ovr-(a.pos===pos?0:14))
      );

    const p=candidates[0];

    if(p)used.add(p.id);

    return p?.id||null;
  });
}

function placePlayer(id,index){
  if(G.fired)return;

  const p=getPlayer(id);

  if(!p||p.team!==G.club)return;

  const old=G.lineup.indexOf(id);

  if(old===index)return;

  const replaced=G.lineup[index];

  if(old>=0){
    G.lineup[old]=replaced||null;
  }

  G.lineup[index]=id;

  selectedPlayer=null;

  saveGame();
  render();
}

function benchPlayer(id){
  if(G.fired)return;

  const index=G.lineup.indexOf(id);

  if(index>=0){
    G.lineup[index]=null;
  }

  selectedPlayer=null;

  saveGame();
  render();
}

function selectPlayer(id){
  selectedPlayer=
    selectedPlayer===id?null:id;

  render();
}

function pointerStart(e,id){
  if(e.button!==undefined&&e.button!==0){
    return;
  }

  drag={
    id,
    x:e.clientX,
    y:e.clientY,
    moved:false
  };

  $("ghost").textContent=
    getPlayer(id)?.name||"";
}

document.addEventListener(
  "pointermove",e=>{
    if(!drag)return;

    if(Math.hypot(
      e.clientX-drag.x,
      e.clientY-drag.y
    )>7){
      drag.moved=true;

      $("ghost").style.display="block";
      $("ghost").style.left=
        e.clientX+12+"px";
      $("ghost").style.top=
        e.clientY+12+"px";
    }
  }
);

document.addEventListener(
  "pointerup",e=>{
    if(!drag)return;

    $("ghost").style.display="none";

    if(drag.moved){
      const target=document.elementFromPoint(
        e.clientX,e.clientY
      );

      const position=
        target?.closest("[data-position]");

      const bench=
        target?.closest("[data-bench]");

      if(position){
        placePlayer(
          drag.id,
          Number(position.dataset.position)
        );
      }else if(bench){
        benchPlayer(drag.id);
      }
    }

    drag=null;
  }
);

function buyPlayer(id){
  if(G.fired){
    notify("경질된 상태에서는 영입할 수 없습니다.");
    return;
  }

  const p=getPlayer(id);

  if(!p||p.team===G.club)return;

  if(p.team===null){
    signFreeAgent(id);
    return;
  }

  const input=prompt(
    `${p.name} 영입 제안\n`+
    `시장 가치 ${money(p.value)}\n`+
    `제안 이적료 ($)`,
    Math.round(p.value*1.1)
  );

  if(input===null)return;

  let fee=Number(
    input.replace(/,/g,"")
  );

  if(!Number.isFinite(fee)||fee<=0)return;

  if(fee>ownTeam().budget){
    notify("이적 예산이 부족합니다.");
    return;
  }

  const seller=getTeam(p.team);

  if(!seller)return;

  const minimum=
    p.value*(.9+Math.random()*.4);

  if(fee<minimum){
    const counter=Math.round(minimum);

    if(!confirm(
      "제안 거절\n"+
      `역제안: ${money(counter)}\n`+
      "수락하시겠습니까?"
    ))return;

    fee=counter;
  }

  if(fee>ownTeam().budget){
    notify("역제안을 수락할 예산이 없습니다.");
    return;
  }

  const annualWage=wageOf(p);

  if(fee+annualWage>ownTeam().budget){
    notify("이적료와 첫해 연봉을 감당할 예산이 부족합니다.");
    return;
  }

  ownTeam().budget-=(fee+annualWage);
  seller.budget+=fee;

  p.team=G.club;
  p.contract=3;
  p.negotiationAttempts=0;
  p.negotiationYear=G.year;

  G.transfers.unshift(
    `${p.name} 영입 · 이적료 ${money(fee)} `+
    `· 연봉 ${money(annualWage)}`
  );

  autoLineup();
  saveGame();
  render();
}

function signFreeAgent(id){
  if(G.fired)return;

  const p=getPlayer(id);

  if(!p||p.team!==null)return;

  const yearsInput=prompt(
    `${p.name} 자유계약 영입\n`+
    "계약 기간 (1~5년)",
    "3"
  );

  if(yearsInput===null)return;

  const years=Number(yearsInput);

  if(!Number.isInteger(years)||
     years<1||years>5){
    notify("계약 기간은 1~5년이어야 합니다.");
    return;
  }

  const demand=playerWageDemand(
    p,years
  );

  const wageInput=prompt(
    `${p.name} 연봉 협상\n`+
    `요구 연봉: ${money(demand)}\n`+
    "제안 연봉 ($)",
    String(demand)
  );

  if(wageInput===null)return;

  const offered=Number(
    wageInput.replace(/,/g,"")
  );

  if(!Number.isFinite(offered)||
     offered<10000){
    notify("올바른 연봉을 입력하세요.");
    return;
  }

  if(offered>ownTeam().budget){
    notify("첫해 연봉을 감당할 예산이 부족합니다.");
    return;
  }

  const ratio=offered/demand;

  const accepted=
    ratio>=1.15||
    (ratio>=1&&Math.random()<.9)||
    (ratio>=.9&&Math.random()<.4);

  if(!accepted){
    alert(
      `${p.name} 선수가 계약 제안을 거절했습니다.\n`+
      `요구 연봉: ${money(demand)}`
    );
    return;
  }

  ownTeam().budget-=offered;

  p.team=G.club;
  p.contract=years;
  p.wage=offered;
  p.negotiationAttempts=0;
  p.negotiationYear=G.year;

  G.transfers.unshift(
    `${p.name} 자유계약 영입 · `+
    `${years}년 · 연봉 ${money(offered)}`
  );

  autoLineup();
  saveGame();
  render();

  notify(`${p.name} 자유계약 영입 성공`);
}

function sellPlayer(id){
  if(G.fired){
    notify("경질된 상태에서는 판매할 수 없습니다.");
    return;
  }

  const p=getPlayer(id);

  if(!p||p.team!==G.club)return;

  const input=prompt(
    `${p.name} 판매 희망액 ($)`,
    p.value
  );

  if(input===null)return;

  const fee=Number(
    input.replace(/,/g,"")
  );

  if(!Number.isFinite(fee)||fee<=0)return;

  const buyers=G.teams.filter(t=>
    t.id!==G.club&&
    t.budget>=fee
  );

  if(!buyers.length){
    notify("구매 가능한 구단이 없습니다.");
    return;
  }

  if(fee>p.value*(.8+Math.random()*.7)){
    notify("판매 제안이 거절되었습니다.");
    return;
  }

  const buyer=pick(buyers);

  buyer.budget-=fee;
  ownTeam().budget+=fee;

  p.team=buyer.id;

  G.transfers.unshift(
    `${p.name} → ${buyer.name} · ${money(fee)}`
  );

  autoLineup();
  saveGame();
  render();
}

/* =========================================
   시즌 종료
========================================= */

function endSeason(){
  if(G.fired){
    notify("경질된 감독은 시즌을 진행할 수 없습니다.");
    return;
  }

  if(nextFixture()){
    notify("리그 일정을 먼저 완료하세요.");
    return;
  }

  const t=ownTeam();

  const table=leagueTable(
    t.country,t.league
  );

  G.history.unshift({
    year:G.year,
    club:t.name,
    rank:table.findIndex(
      x=>x.id===t.id
    )+1,
    points:t.points
  });

  /* 승강제 */

  const moves=[];

  for(const country of [
    "잉글랜드","독일","이탈리아","스페인"
  ]){
    const tiers=[
      ...new Set(
        G.teams
          .filter(t=>t.country===country)
          .map(t=>t.tier)
      )
    ].sort((a,b)=>a-b);

    for(let i=0;i<tiers.length-1;i++){
      const upper=G.teams.filter(t=>
        t.country===country&&
        t.tier===tiers[i]
      );

      const lower=G.teams.filter(t=>
        t.country===country&&
        t.tier===tiers[i+1]
      );

      const upperLeague=upper[0]?.league;
      const lowerLeague=lower[0]?.league;

      if(!upperLeague||!lowerLeague)continue;

      const upTable=leagueTable(
        country,upperLeague
      );

      const downTable=leagueTable(
        country,lowerLeague
      );

      const count=Math.min(
        3,upTable.length,downTable.length
      );

      for(let j=0;j<count;j++){
        moves.push({
          relegated:upTable[
            upTable.length-1-j
          ],
          promoted:downTable[j],
          upperLeague,
          lowerLeague,
          upperTier:tiers[i],
          lowerTier:tiers[i+1]
        });
      }
    }
  }

  for(const m of moves){
    m.relegated.league=m.lowerLeague;
    m.relegated.tier=m.lowerTier;

    m.promoted.league=m.upperLeague;
    m.promoted.tier=m.upperTier;
  }

  /* AI 자동 재계약 */

  const aiRenewal=processAIRenewals();

  /* 선수 성장 및 계약 만료 */

  const expired=[];

  for(const p of G.players){
    p.age++;

    if(p.team!==null){
      p.contract=Math.max(
        0,p.contract-1
      );
    }

    if(p.age<26&&Math.random()<.5){
      p.ovr=Math.min(
        99,p.ovr+random(0,2)
      );
    }

    if(p.age>32&&Math.random()<.45){
      p.ovr=Math.max(
        40,p.ovr-random(0,2)
      );
    }

    p.value=playerValue(
      p.ovr,p.age
    );

    if(p.team!==null&&p.contract<=0){
      const previousTeam=getTeam(p.team);

      expired.push({
        name:p.name,
        team:previousTeam?.name||"알 수 없음",
        userClub:p.team===G.club
      });

      p.team=null;
      p.contract=0;
    }

    p.negotiationAttempts=0;
    p.negotiationYear=G.year+1;
  }

  /* 다음 시즌 */

  G.year++;

  for(const team of G.teams){
    const count=random(3,4);

    for(let i=0;i<count;i++){
      const pos=pick(POSITIONS);

      const name=
        pick(YOUTH_SURNAMES)+
        pick(YOUTH_NAMES);

      G.players.push(
        createPlayer(team,{
          name,
          pos,
          age:20,
          ovr:random(48,75),
          contract:3,
          generated:true,
          source:"게임 생성 유망주"
        })
      );
    }

    resetTeam(team);

    team.budget+=
      random(5,30)*1000000;
  }

  /* AI 구단 이적시장 */

  const aiMarket=processAITransfers();

  const userExpired=expired.filter(
    x=>x.userClub
  );

  if(userExpired.length){
    G.inbox.unshift(
      "계약 만료로 팀을 떠난 선수: "+
      userExpired.map(x=>x.name).join(", ")
    );
  }

  /* 감독 계약 */

  G.contract=Math.max(
    0,G.contract-1
  );

  if(G.contract===0){
    fireManager(
      "감독 계약이 만료되었으며 "+
      "재계약이 체결되지 않아 구단을 떠나게 되었습니다."
    );
  }else{
    G.rating=Math.min(
      100,
      Math.round((G.rating+8)*10)/10
    );
  }

  // 시즌이 바뀌면 연승·연패 초기화
  // 부임 보호기간 경기 수는 유지
  G.winStreak=0;
  G.lossStreak=0;

  createSeason();
  autoLineup();

  G.inbox.unshift(
    `${G.year}년 새 시즌 시작. `+
    `계약 만료 ${expired.length}명 · `+
    `AI 재계약 ${aiRenewal.renewed}명 · `+
    `AI 이적 ${aiMarket.sales}건 · `+
    `자유계약 영입 ${aiMarket.freeSignings}건`
  );

  saveGame();
  render();

  if(G.fired){
    alert(
      "감독 계약 종료\n\n"+
      "기존 계약이 만료되어 구단을 떠났습니다.\n"+
      "감독 경력 메뉴에서 다른 구단을 선택하세요."
    );
  }
}

/* =========================================
   GitHub 선수 데이터
========================================= */

async function newGame(n){
  if(slotData(n)&&!confirm(
    `슬롯 ${n}의 데이터를 덮어쓸까요?`
  ))return;

  slot=n;
  initialize();

  try{
    const response=await fetch(
      PLAYER_DATA_URL,
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error(
        "HTTP "+response.status
      );
    }

    const data=await response.json();

    const list=Array.isArray(data)?
      data:data?.players;

    if(!Array.isArray(list)){
      throw new Error(
        "players.json에 선수 배열이 없습니다."
      );
    }

    let count=0;
    let skipped=0;

    const clubMap=new Map();

    for(const t of G.teams){
      clubMap.set(t.name,t);
    }

    for(const x of list){
      const club=clubMap.get(x.club);

      if(!club||
         (x.league&&club.league!==x.league)){
        skipped++;
        continue;
      }

      const name=String(
        x.name_ko||x.name||""
      ).trim();

      if(!name){
        skipped++;
        continue;
      }

      G.players.push(
        createPlayer(club,{
          name,
          originalName:x.name||name,
          age:x.age,
          pos:x.position||x.pos,
          ovr:x.ovr,
          value:x.value,
          contract:x.contract,
          wage:x.wage,
          stats:x.stats,
          generated:false,
          source:x.source||
            "GitHub 실제 선수단"
        })
      );

      count++;
    }

    notify(
      `선수 ${count}명 불러오기 완료`
    );

    if(skipped){
      console.warn(
        "등록되지 않은 선수:",skipped
      );
    }

  }catch(error){
    alert(
      "GitHub 선수 데이터를 불러오지 못했습니다.\n"+
      error.message
    );
  }

  slotScreen=false;
  page="start";
  render();
}

function importJSON(event){
  const file=event.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const data=JSON.parse(
        reader.result
      );

      if(
        data&&
        !Array.isArray(data)&&
        Array.isArray(data.teams)&&
        Array.isArray(data.players)
      ){
        if(!slot){
          alert(
            "저장 슬롯을 먼저 선택하세요."
          );
          return;
        }

        G=data;
        normalizeSave();

        slotScreen=false;
        page=G.club?"home":"start";

        saveGame();
        render();
        return;
      }

      const list=Array.isArray(data)?
        data:data.players;

      if(!Array.isArray(list)){
        throw Error(
          "선수 배열이 없습니다."
        );
      }

      let added=0;
      let skipped=0;

      const unmatched=new Set();

      for(const x of list){
        const clubName=String(
          x.club||x.team||""
        ).trim();

        const leagueName=String(
          x.league||""
        ).trim();

        const candidates=G.teams.filter(t=>
          t.name===clubName&&
          (!leagueName||
           t.league===leagueName)
        );

        if(candidates.length!==1){
          unmatched.add(
            clubName||"(구단명 없음)"
          );
          skipped++;
          continue;
        }

        const t=candidates[0];

        const name=String(
          x.name_ko||x.name||""
        ).trim();

        if(!name){
          skipped++;
          continue;
        }

        if(squad(t.id).some(p=>
          p.name===name||
          p.originalName===String(x.name||"")
        )){
          skipped++;
          continue;
        }

        G.players.push(
          createPlayer(t,{
            name,
            originalName:x.name||name,
            age:x.age,
            pos:x.position||x.pos,
            ovr:x.ovr,
            value:x.value,
            contract:x.contract,
            wage:x.wage,
            stats:x.stats,
            generated:false,
            source:x.source||
              "외부 선수단 JSON"
          })
        );

        added++;
      }

      if(G.club)autoLineup();

      saveGame();
      render();

      alert(
        `선수 데이터 등록 결과\n`+
        `추가: ${added}명\n`+
        `중복·미등록: ${skipped}명\n`+
        `구단명 매칭 실패: ${unmatched.size}개\n\n`+
        [...unmatched].slice(0,15).join(", ")
      );

    }catch(err){
      alert(
        "JSON 파일 오류: "+err.message
      );
    }
  };

  reader.readAsText(file);
  event.target.value="";
}

/* =========================================
   선수 정렬
========================================= */

function setSort(field){
  if(sortField===field){
    sortAscending=!sortAscending;
  }else{
    sortField=field;
    sortAscending=field!=="ovr";
  }

  render();
}

function sortPlayers(list){
  return [...list].sort((a,b)=>{
    let result=0;

    if(sortField==="name"){
      result=a.name.localeCompare(
        b.name,"ko"
      );
    }else if(sortField==="pos"){
      result=
        POSITIONS.indexOf(a.pos)-
        POSITIONS.indexOf(b.pos);
    }else{
      result=
        (a[sortField]||0)-
        (b[sortField]||0);
    }

    return sortAscending?
      result:-result;
  });
}

function playerTable(list,actions=true){
  return `
  <div class="scroll">
  <table>
    <tr>
      ${[
        ["name","이름"],
        ["age","나이"],
        ["pos","포지션"],
        ["ovr","OVR"]
      ].map(([key,label])=>`
        <th class="sortable"
          onclick="setSort('${key}')">
          ${label}
          ${sortField===key?
            (sortAscending?"▲":"▼"):"↕"}
        </th>
      `).join("")}

      <th>속도</th>
      <th>슈팅</th>
      <th>패스</th>

        </div>

          <span class="muted">
            빈 자리
          </span>
        `}
      </div>`;

      <select
        onchange="changeFormation(this.value)">
        ${Object.keys(FORMATIONS)
          .map(f=>`
          <option
            ${G.formation===f?"selected":""}>
            ${f}
          </option>
        `).join("")}
      </select>

      ${[
        [
          "tactic",
          ["균형","공격","수비","역습","점유율"]
        ],
        [
          "tempo",
          ["느림","보통","빠름"]
        ],
        [
          "press",
          ["낮음","중간","높음"]

        <select

      `).join("")}

    <div class="pitch">
      ${pitch}
    </div>

    <h3>후보 선수 (${bench.length}명)</h3>

    <div class="bench" data-bench="true">
      ${bench.map(p=>`
        <div class="playercard
          ${selectedPlayer===p.id?
            "selected":""}"
          onpointerdown="pointerStart(event,'${p.id}')"
          onclick="selectPlayer('${p.id}')">

          ${escapeHTML(p.name)}

}

        ${graceRemaining()}경기 남았습니다.
        첫 12경기까지는 평점이
        0점 미만일 때만 경질됩니다.
      </p>
    `:`
      <p class="contract-warning">
        부임 보호기간이 종료되었습니다.
        감독 평점이 40.0점 미만이면
        계약 기간과 관계없이 경질됩니다.
      </p>
    `}

    ${G.fired?`
      <div class="notice">
        <h3 class="bad">감독직 종료</h3>

        <p>
          ${escapeHTML(
            G.firingReason||
            "현재 구단과의 계약이 종료되었습니다."
          )}
        </p>
      </div>
    `:""}
  </div>

  <div class="card">
    <h2>감독 재계약</h2>

    ${G.fired?`
      <p class="bad">
        이미 구단을 떠났기 때문에
        이 팀과 재계약할 수 없습니다.
      </p>
    `:`
      <p>
        현재 계약이 몇 시즌 남았든
        이사회에 계약 연장을 신청할 수 있습니다.
      </p>

      <p>
        현재 계약:
        <b>${G.contract}시즌</b>
      </p>

      <p>
        현재 평점:
        <b>${ratingText()}점</b>
      </p>

      <p class="muted small">
        감독 평점이 높을수록 이사회가
        재계약을 승인할 가능성이 높습니다.
        긴 계약일수록 승인 기준이
        까다로워집니다.
      </p>

      <div class="contract-form">
        <label>
          추가 계약 기간

          <select id="managerRenewYears"
            onchange="updateManagerContractPreview()">
            ${[1,2,3,4,5].map(y=>`
              <option value="${y}">
                +${y}년
              </option>
            `).join("")}
          </select>
        </label>

        <button onclick="renewManager()">
          이사회에 재계약 신청
        </button>
      </div>

      <p id="managerContractPreview" class="good">
        기존 ${G.contract}년
        + 추가 1년
        = 총 ${G.contract+1}년
      </p>

      ${managerNegotiationResult?`
        <div class="contract-result
          ${managerNegotiationResult.success?
            "success":"fail"}">

          <p>
            ${escapeHTML(
              managerNegotiationResult.message
            )}
          </p>
        </div>
      `:""}
    `}
  </div>

  <div class="card">
    <h3>다른 구단으로 이동</h3>

    <p class="muted small">
      새 구단에 부임하면 감독 평점은
      60.0점으로 설정되며,
      부임 보호기간 12경기와
      연승·연패 기록이 새로 시작됩니다.
    </p>

    <div class="row">
      <select id="careerClub">
        ${G.teams
          .filter(t=>t.id!==G.club)
          .map(t=>`
          <option value="${t.id}">
            ${escapeHTML(t.name)}
            ·
            ${escapeHTML(t.league)}
          </option>
        `).join("")}
      </select>

      <button onclick="changeClub()">
        구단 이동
      </button>
    </div>
  </div>

  <div class="card">
    <h3>감독 계약 기록</h3>

    ${G.managerContractHistory
      .slice(0,20)
      .map(x=>`
      <p>
        ${x.year}년
        · ${escapeHTML(x.club)}
        · ${escapeHTML(x.result)}
        ${x.years?
          " · 총 "+x.years+"년":""}
      </p>
      `).join("")||
      '<p class="muted">기록 없음</p>'}
  </div>

  <div class="card">
    <h3>시즌 기록</h3>

    ${G.history.map(h=>`
      <p>
        ${h.year}년
        · ${escapeHTML(h.club)}
        · ${h.rank}위
        · ${h.points}점
      </p>
    `).join("")||
    "시즌 기록 없음"}
  </div>`;
}

function updateManagerContractPreview(){
  const years=Number(
    $("managerRenewYears").value
  );

  $("managerContractPreview").textContent=
    `기존 ${G.contract}년 + 추가 ${years}년`+
    ` = 총 ${G.contract+years}년`;
}

/* =========================================
   선수 데이터 화면
========================================= */

function dataView(){
  const covered=G.teams.filter(t=>
    squad(t.id).some(
      p=>!p.generated
    )
  ).length;

  return `
  <div class="card">
    <h2>실제 선수단 데이터</h2>

    <div class="grid">
      <div class="card">
        <div class="muted">
          전체 구단
        </div>

        <div class="big">
          ${G.teams.length}
        </div>
      </div>

      <div class="card">
        <div class="muted">
          실명 선수 등록 구단
        </div>

        <div class="big">
          ${covered}
        </div>
      </div>

      <div class="card">
        <div class="muted">
          등록 선수
        </div>

        <div class="big">
          ${G.players.length}
        </div>
      </div>
    </div>

    <p class="notice">
      현재 선수단은 GitHub의
      data/players.json에서 불러옵니다.
      등록되지 않은 구단에는
      가상 선수를 자동으로 채우지 않습니다.
    </p>

    <button onclick="openImport()">
      선수단 JSON 파일 직접 불러오기
    </button>

    <h3>선수 데이터 형식</h3>

    <pre>{
  "players": [
    {
      "club": "아스널",
      "name": "Bukayo Saka",
      "name_ko": "부카요 사카",
      "age": 25,
      "position": "RW",
      "ovr": 87,
      "contract": 3,
      "wage": 5000000
    }
  ]
}</pre>

    <p class="muted">
      wage 항목이 없는 선수는
      능력치와 시장 가치에 따라
      초기 연봉이 자동 설정됩니다.
    </p>

    <h3>구단별 등록 현황</h3>

    <div class="scroll">
    <table>
      <tr>
        <th>리그</th>
        <th>구단</th>
        <th>실명 등록</th>
        <th>생성 선수</th>
        <th>연간 총연봉</th>
      </tr>

      ${G.teams.map(t=>`
      <tr>
        <td>
          ${escapeHTML(t.league)}
        </td>

        <td>
          ${escapeHTML(t.name)}
        </td>

        <td>
          ${squad(t.id)
            .filter(p=>!p.generated)
            .length}명
        </td>

        <td>
          ${squad(t.id)
            .filter(p=>p.generated)
            .length}명
        </td>

        <td>
          ${money(teamPayroll(t.id))}
        </td>
      </tr>
      `).join("")}
    </table>
    </div>
  </div>`;
}

/* =========================================
   AI 이적 기록 화면
========================================= */

function aiMarketView(){
  const records=G.aiTransferHistory||[];

  return `
  <div class="card">
    <h2>AI 구단 이적시장</h2>

    <p class="notice">
      AI 구단은 시즌이 끝날 때
      선수의 능력치, 나이, 팀 내 기여도,
      포지션과 예산을 고려해
      자동으로 재계약 및 이적 활동을 진행합니다.
    </p>

    <div class="grid">
      <div class="card">
        <div class="muted">
          AI 구단 간 이적 기록
        </div>
        <div class="big">
          ${records.filter(x=>x.fee>0).length}
        </div>
      </div>

      <div class="card">
        <div class="muted">
          AI 자유계약 영입
        </div>
        <div class="big">
          ${records.filter(x=>x.fee===0).length}
        </div>
      </div>

      <div class="card">
        <div class="muted">
          AI 재계약 기록
        </div>
        <div class="big">
          ${G.contractHistory.filter(x=>x.ai).length}
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>최근 AI 이적</h3>

    ${records.slice(0,100).map(x=>`
      <p>
        ${x.year}년
        · ${escapeHTML(x.player)}
        · ${escapeHTML(x.from)}
        →
        ${escapeHTML(x.to)}
        · ${money(x.fee)}
      </p>
    `).join("")||
    '<p class="muted">아직 AI 이적 기록이 없습니다.</p>'}
  </div>

  <div class="card">
    <h3>최근 AI 재계약</h3>

    ${G.contractHistory
      .filter(x=>x.ai)
      .slice(0,100)
      .map(x=>`
      <p>
        ${x.year}년
        · ${escapeHTML(x.team)}
        · ${escapeHTML(x.player)}
        · ${x.oldYears}년
        → ${x.newYears}년
        · ${money(x.newWage)}
      </p>
    `).join("")||
    '<p class="muted">아직 AI 재계약 기록이 없습니다.</p>'}
  </div>`;
}

/* =========================================
   페이지 이동
========================================= */

function setPage(p){
  page=p;
  selectedPlayer=null;

  if(p!=="contracts"){
    negotiationResult=null;
  }

  render();
}

/* =========================================
   렌더링
========================================= */

function render(){
  if(slotScreen){
    $("heading").textContent=
      "커리어 선택";

    $("identity").textContent=
      "저장 슬롯 3개";

    $("nav").innerHTML="";
    $("app").innerHTML=slotsView();

    return;
  }

  if(page==="start"||!G.club){
    $("heading").textContent=
      "새 커리어";

    $("identity").textContent=
      "감독 생성";

    $("nav").innerHTML="";
    $("app").innerHTML=startView();

    updateStartTeams();

    return;
  }

  const menus={
    home:"대시보드",
    squad:"선수단",
    contracts:"선수 재계약",
    tactics:"전술·선발",
    fixtures:"경기 일정",
    league:"리그 순위",
    transfers:"이적시장",
    aiMarket:"AI 이적 기록",
    cups:"컵대회",
    career:"감독 경력",
    data:"선수 데이터"
  };

  $("heading").textContent=
    menus[page]||"대시보드";

  $("identity").innerHTML=`
    <b>${escapeHTML(G.manager)}</b>

    <p>
      ${escapeHTML(
        ownTeam().name
      )}
    </p>

    <small>
      ${G.year}/
      ${String(G.year+1).slice(2)}
    </small>

    <p class="small">
      평점 ${ratingText()}점
    </p>

    ${G.fired?`
      <p class="bad">감독직 종료</p>
    `:isManagerProtected()?`
      <p class="good">
        보호기간 ${graceRemaining()}경기 남음
      </p>
    `:""}
  `;

  $("nav").innerHTML=
    Object.entries(menus)
      .map(([key,label])=>`
      <button
        class="${page===key?
          "active":""}"
        onclick="setPage('${key}')">

        ${label}
      </button>
    `).join("");

  const views={
    home:homeView,
    squad:squadView,
    contracts:contractsView,
    tactics:tacticsView,
    fixtures:fixturesView,
    league:leagueView,
    transfers:transfersView,
    aiMarket:aiMarketView,
    cups:cupsView,
    career:careerView,
    data:dataView
  };

  $("app").innerHTML=
    (views[page]||homeView)();
}

/* =========================================
   실행
========================================= */

initialize();
render();

</script>
</body>
</html>
